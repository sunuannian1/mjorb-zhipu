[package]
name = "rust_bridge"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
name = "rust_bridge"

[dependencies]
# <--- bridge.rs -->
# Service wrappers: Device, Lockdown, AFC, InstProxy, Misagent, Mounter, Heartbeat, DebugServer
rusty_libimobiledevice = { git = "https://github.com/SideStore/rusty_libimobiledevice", features = [
  "dynamic",
], default-features = false }
# Plist parsing: instproxy lookup, misagent copy, heartbeat, mounter lookup
plist_plus = { version = "0.2", features = ["dynamic"] }
# JSON serialization: debugserver_set_argv, afc_get_file_info, afc_read_directory
serde_json = "1"

# <--- post17.rs -->
# iOS 17+ async operations: CoreDeviceProxy, XPCDevice, DVT, DebugProxy, ImageMounter
idevice = { git = "https://github.com/jkcoxson/idevice", rev = "a714d35d95dc16769f8a54a6168ccec6338b73c7", features = ["full"] }
plist = "1.7.1"
# on-device 安装对齐 SideStore/minimuxer：把签名后的 .app 逐文件铺到 PublicStaging。
# IPA 本质是该 .app 的 zip，这里在内存流式解包（纯 Rust deflate，无 C 依赖，可交叉编译 iOS）。
zip = { version = "2", default-features = false, features = ["deflate"] }
# Async runtime: block_on for iOS 17+ JIT and DDI mount
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "sync"] }
# Lazy static RUNTIME
once_cell = "1"
# Logging
base64 = "0.22"
rcgen = "0.13.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
log = "0.4"

